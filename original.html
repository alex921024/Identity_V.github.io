<title>約你打第五</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23FF7FA8' d='M12 21s-6.7-4.3-9.3-8.1C.9 10.5 2 6.8 5 5.6 7.2 4.7 9.6 5.5 12 8c2.4-2.5 4.8-3.3 7-2.4 3 1.2 4.1 4.9 2.3 7.3C18.7 16.7 12 21 12 21z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'ZCOOL KuaiLe','Noto Sans SC',-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;background:#F6E0FF;overflow:hidden}

  /* ===== 应用容器与背景 ===== */
  .app{position:relative;height:100vh;height:100dvh;overflow:hidden;overscroll-behavior:none;
    background:linear-gradient(168deg,#FFE0EF 0%,#F6E0FF 46%,#E1CDFF 100%);
    display:flex;flex-direction:column;color:#7A4F8E}
  .blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;pointer-events:none;z-index:0}
  .blob-1{width:340px;height:340px;background:#FFC9E0;top:-90px;right:-90px}
  .blob-2{width:300px;height:300px;background:#D9C2FF;bottom:-70px;left:-80px}
  .blob-3{width:200px;height:200px;background:#FFD6C2;top:38%;left:-70px;opacity:.4}

  /* ===== 漂浮爱心与星星 ===== */
  .deco{position:absolute;z-index:1;pointer-events:none;animation:floaty 6s ease-in-out infinite;color:#FF9EC0}
  .deco.star{color:#C9A8FF}
  .deco svg{display:block;width:100%;height:100%}
  @keyframes floaty{
    0%{transform:translateY(0) rotate(-10deg)}
    50%{transform:translateY(-22px) rotate(12deg)}
    100%{transform:translateY(0) rotate(-10deg)}
  }

  /* ===== 状态栏（模拟系统） ===== */
  .status-bar{position:relative;z-index:6;display:flex;justify-content:space-between;align-items:center;
    padding:14px 26px 2px;padding-top:calc(14px + env(safe-area-inset-top));
    color:#9B7BB8;font-size:14px;font-weight:700;letter-spacing:.5px}
  .sb-right{display:flex;align-items:center;gap:7px}
  .sb-right svg{display:block;height:13px;width:auto;color:#9B7BB8}

  /* ===== 视图容器与淡入淡出切换 ===== */
  .stage{position:relative;flex:1;overflow:hidden;z-index:2}
  .view{position:absolute;inset:0;padding:6px 22px calc(34px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;
    opacity:0;visibility:hidden;transform:translateY(18px);
    transition:opacity .38s ease,transform .38s ease,visibility 0s linear .38s}
  .view.active{opacity:1;visibility:visible;transform:none;transition:opacity .38s ease,transform .38s ease}
  .pop{animation:popIn .5s cubic-bezier(.34,1.5,.64,1) both}
  @keyframes popIn{0%{transform:scale(.9);opacity:.5}100%{transform:scale(1);opacity:1}}

  /* ===== 卡片 ===== */
  .card{background:#fff;border-radius:34px;box-shadow:0 16px 44px rgba(168,110,235,.22);
    padding:30px 24px;text-align:center;position:relative;width:100%}

  /* ===== 按钮 ===== */
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;
    font-family:inherit;min-height:58px;border-radius:999px;font-size:20px;letter-spacing:2px;
    transition:transform .14s ease,box-shadow .2s ease;touch-action:manipulation;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .btn:active{transform:scale(.93)}
  .btn-primary{background:linear-gradient(135deg,#FF8DB4 0%,#C79BFF 100%);color:#fff;
    box-shadow:0 12px 26px rgba(199,120,255,.38)}
  .btn-ghost{background:#fff;color:#E0709E;border:2px solid #FFC9DC;box-shadow:0 8px 20px rgba(199,120,255,.18)}
  .btn-heartbeat{animation:heartbeat 2.2s ease-in-out infinite}
  @keyframes heartbeat{0%,100%{transform:scale(1)}8%{transform:scale(1.05)}16%{transform:scale(1)}24%{transform:scale(1.04)}32%{transform:scale(1)}}

  /* ===== 首页 ===== */
  .view-home{align-items:center;justify-content:center;gap:22px}
  .badge{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.78);
    border:1.5px solid #F5C6DC;color:#D0669C;border-radius:999px;padding:8px 18px;font-size:14px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .badge svg{width:14px;height:14px;color:#FF7FA8;animation:heartbeat 1.6s ease-in-out infinite}
  .avatar-wrap{position:relative;width:152px;height:152px;margin:8px auto 20px}
  .halo{position:absolute;inset:-16px;border-radius:50%;
    background:conic-gradient(from 0deg,#FFB3CE,#C9A2FF,#FFB3CE,#C9A2FF,#FFB3CE);
    filter:blur(2px);opacity:.6;animation:spin 9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .avatar-wrap img{position:relative;z-index:1;width:100%;height:100%;border-radius:50%;
    object-fit:cover;border:5px solid #fff;box-shadow:0 10px 26px rgba(199,120,255,.35)}
  .big-title{position:relative;font-size:26px;line-height:1.55;color:#7A4F8E;margin:0}
  .big-title .tw{position:absolute;top:-14px;animation:twinkle 1.8s ease-in-out infinite}
  .big-title .tw.l{left:-26px;width:20px;height:20px;color:#FFB1CC}
  .big-title .tw.r{right:-26px;bottom:-10px;width:16px;height:16px;color:#C9A8FF;animation-delay:.6s}
  .big-title .tw.t2{left:44%;top:-22px;width:13px;height:13px;color:#D9B8FF;animation-delay:1.1s}
  @keyframes twinkle{0%,100%{transform:scale(.7) rotate(0);opacity:.5}50%{transform:scale(1.15) rotate(20deg);opacity:1}}
  .btn-row{display:flex;gap:14px;width:100%;max-width:420px}
  .btn-yes{flex:1.35}
  .btn-no{flex:1;position:relative}
  .btn-no.escaped{position:absolute;z-index:8;transition:left .34s cubic-bezier(.3,1.35,.5,1),top .34s cubic-bezier(.3,1.35,.5,1)}
  .btn-no.wobble{animation:wobble .5s ease}
  @keyframes wobble{0%{transform:rotate(0) scale(1)}25%{transform:rotate(-8deg) scale(1.08)}60%{transform:rotate(7deg) scale(1.04)}100%{transform:rotate(0) scale(1)}}

  /* ===== 确认页 ===== */
  .view-confirm{align-items:center;justify-content:center;gap:22px}
  .confirm-icon{width:74px;height:74px;margin:0 auto 6px;color:#FF7FA8;animation:heartbeat 1.8s ease-in-out infinite}
  .confirm-text{font-size:23px;line-height:1.7;color:#7A4F8E;margin:0 0 8px}
  .confirm-sub{font-size:15px;color:#B58AC9;margin-bottom:4px}

  /* ===== 时间页 ===== */
  .view-time{padding-top:10px}
  .back-btn{position:absolute;top:6px;left:18px;width:44px;height:44px;border-radius:50%;
    background:rgba(255,255,255,.8);border:1.5px solid #F5C6DC;color:#C0609A;display:flex;
    align-items:center;justify-content:center;cursor:pointer;z-index:5;transition:transform .15s ease;
    touch-action:manipulation;box-shadow:0 6px 16px rgba(199,120,255,.16)}
  .back-btn:active{transform:scale(.9)}
  .back-btn svg{width:20px;height:20px}
  .page-title{font-size:26px;line-height:1.5;color:#7A4F8E;text-align:center;margin:10px 0 18px}
  .sec-label{display:flex;align-items:center;gap:8px;color:#D0669C;font-size:16px;margin:6px 0 12px}
  .sec-label svg{width:19px;height:19px;color:#FF7FA8}
  .date-row{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x proximity;
    scrollbar-width:none;-ms-overflow-style:none}
  .date-row::-webkit-scrollbar{display:none}
  .date-chip{flex:0 0 74px;scroll-snap-align:center;background:#fff;border:2px solid #F3D6E8;
    border-radius:20px;padding:13px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;
    cursor:pointer;font-family:inherit;color:#A56FBE;transition:transform .15s ease,background .25s ease,border-color .25s ease;
    touch-action:manipulation;user-select:none;-webkit-user-select:none}
  .date-chip:active{transform:scale(.92)}
  .date-chip .dc-top{font-size:15px}
  .date-chip .dc-sub{font-size:13px;opacity:.75}
  .date-chip.on{background:linear-gradient(150deg,#FF8DB4,#C79BFF);border-color:transparent;color:#fff;
    box-shadow:0 8px 18px rgba(199,120,255,.35)}
  .time-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:6px}
  .time-chip{background:#fff;border:2px solid #F3D6E8;border-radius:18px;padding:14px 0;font-family:inherit;
    font-size:17px;color:#A56FBE;cursor:pointer;transition:transform .15s ease,background .25s ease,border-color .25s ease;
    touch-action:manipulation;user-select:none;-webkit-user-select:none}
  .time-chip:active{transform:scale(.92)}
  .time-chip.on{background:linear-gradient(150deg,#FF8DB4,#C79BFF);border-color:transparent;color:#fff;
    box-shadow:0 8px 18px rgba(199,120,255,.35)}
  .spacer{flex:1;min-height:16px}

  /* ===== 模式页 ===== */
  .view-mode{padding-top:10px}
  .page-sub{font-size:15px;color:#B58AC9;text-align:center;margin:-8px 0 16px}
  .mode-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .mode-chip{position:relative;background:#fff;border:2px solid #F3D6E8;border-radius:22px;padding:20px 8px;
    font-family:inherit;font-size:20px;color:#A56FBE;cursor:pointer;letter-spacing:2px;
    transition:transform .15s ease,background .25s ease,border-color .25s ease,color .25s ease;
    touch-action:manipulation;user-select:none;-webkit-user-select:none}
  .mode-chip:active{transform:scale(.93)}
  .mode-chip .check{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;
    background:linear-gradient(135deg,#FF7FA8,#C79BFF);color:#fff;display:flex;align-items:center;justify-content:center;
    transform:scale(0);transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
  .mode-chip .check svg{width:14px;height:14px}
  .mode-chip.on{background:linear-gradient(150deg,#FF8DB4,#C79BFF);border-color:transparent;color:#fff;
    box-shadow:0 10px 22px rgba(199,120,255,.38)}
  .mode-chip.on .check{transform:scale(1)}

  /* ===== 结果页 ===== */
  .view-result{align-items:center;justify-content:center;gap:20px}
  .result-avatar{position:relative;width:116px;height:116px;margin:4px auto 0}
  .result-avatar img{position:relative;z-index:1;width:100%;height:100%;border-radius:50%;object-fit:cover;
    border:4px solid #fff;box-shadow:0 10px 24px rgba(199,120,255,.35)}
  .result-title{font-size:23px;line-height:1.6;color:#7A4F8E;text-align:center;margin:0}
  .info-card{background:#fff;border-radius:28px;box-shadow:0 16px 40px rgba(168,110,235,.22);
    padding:10px 20px;width:100%;max-width:420px}
  .info-row{display:flex;align-items:center;gap:13px;padding:15px 2px;border-bottom:1.5px dashed #F3D6E8}
  .info-row:last-child{border-bottom:none}
  .info-ico{flex:0 0 40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#FFE1EE,#EFDFFF);
    color:#E0709E;display:flex;align-items:center;justify-content:center}
  .info-ico svg{width:20px;height:20px}
  .info-label{font-size:15px;color:#B58AC9;flex:0 0 52px}
  .info-value{flex:1;font-size:17px;color:#7A4F8E;text-align:right;line-height:1.4;word-break:break-word}
  .slogan{display:flex;align-items:center;gap:10px;color:#B57BD4;font-size:16px;letter-spacing:1px}
  .slogan svg{width:16px;height:16px;color:#FF8DB4}
  .slogan .s-star{color:#C9A8FF}
  .send-note{font-size:13px;color:#B58AC9;text-align:center;margin:0}

  /* ===== Toast 提示 ===== */
  .toast{position:fixed;top:16%;left:50%;transform:translate(-50%,-12px) scale(.9);z-index:99;
    background:rgba(255,255,255,.96);color:#C0609A;font-size:16px;letter-spacing:1px;
    padding:12px 22px;border-radius:999px;box-shadow:0 12px 30px rgba(199,120,255,.3);
    opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;max-width:82%;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0) scale(1)}

  /* ===== 底部 Home 指示条 ===== */
  .home-bar{position:absolute;bottom:calc(9px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    width:132px;height:5px;border-radius:99px;background:rgba(109,74,125,.35);z-index:6;pointer-events:none}

  @media (min-width:520px){
    .view{padding-left:calc((100vw - 430px)/2 + 22px);padding-right:calc((100vw - 430px)/2 + 22px)}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <!-- 柔光色斑 -->
  <div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div>

  <!-- 漂浮装饰：爱心与星星 -->
  <div class="deco" style="top:9%;left:8%;width:22px;height:22px;animation-duration:5.6s"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-6.7-4.3-9.3-8.1C.9 10.5 2 6.8 5 5.6 7.2 4.7 9.6 5.5 12 8c2.4-2.5 4.8-3.3 7-2.4 3 1.2 4.1 4.9 2.3 7.3C18.7 16.7 12 21 12 21z"/></svg></div>
  <div class="deco star" style="top:16%;right:10%;width:18px;height:18px;animation-duration:7s"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.9 5.8 21l1.6-7L2 9.2l7.1-.6z"/></svg></div>
  <div class="deco" style="top:30%;left:16%;width:15px;height:15px;animation-duration:6.4s"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-6.7-4.3-9.3-8.1C.9 10.5 2 6.8 5 5.6 7.2 4.7 9.6 5.5 12 8c2.4-2.5 4.8-3.3 7-2.4 3 1.2 4.1 4.9 2.3 7.3C18.7 16.7 12 21 12 21z"/></svg></div>
  <div class="deco star" style="top:52%;left:6%;width:14px;height:14px;animation-duration:8s"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.9 5.8 21l1.6-7L2 9.2l7.1-.6z"/></svg></div>
  <div class="deco" style="top:64%;right:7%;width:20px;height:20px;animation-duration:6s"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-6.7-4.3-9.3-8.1C.9 10.5 2 6.8 5 5.6 7.2 4.7 9.6 5.5 12 8c2.4-2.5 4.8-3.3 7-2.4 3 1.2 4.1 4.9 2.3 7.3C18.7 16.7 12 21 12 21z"/></svg></div>
  <div class="deco star" style="top:78%;right:16%;width:16px;height:16px;animation-duration:7.4s"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.9 5.8 21l1.6-7L2 9.2l7.1-.6z"/></svg></div>
  <div class="deco" style="top:44%;right:4%;width:13px;height:13px;animation-duration:5.2s"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-6.7-4.3-9.3-8.1C.9 10.5 2 6.8 5 5.6 7.2 4.7 9.6 5.5 12 8c2.4-2.5 4.8-3.3 7-2.4 3 1.2 4.1 4.9 2.3 7.3C18.7 16.7 12 21 12 21z"/></svg></div>
  <div class="deco star" style="top:86%;left:10%;width:14px;height:14px;animation-duration:6.8s"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.9 5.8 21l1.6-7L2 9.2l7.1-.6z"/></svg></div>

  <!-- 模拟系统状态栏 -->
  <div class="status-bar">
    <span id="sb-time">12:00</span>
    <div class="sb-right">
      <svg viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg viewBox="0 0 16 12" fill="currentColor"><path d="M8 11a1.2 1.2 0 1 0 0-2.4A1.2 1.2 0 0 0 8 11z"/><path d="M8 6.9c1.6 0 3 .6 4.1 1.7l-1.5 1.5A3.6 3.6 0 0 0 8 8.1c-1 0-1.9.4-2.6 1.1L3.9 7.7A5.8 5.8 0 0 1 8 6.9z"/><path d="M8 2.8c2.8 0 5.4 1.1 7.2 3l-1.5 1.5A8.2 8.2 0 0 0 8 5a8.2 8.2 0 0 0-5.7 2.3L.8 5.8A10.4 10.4 0 0 1 8 2.8z"/></svg>
      <svg viewBox="0 0 27 13" fill="currentColor"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2.5" y="2.5" width="17" height="8" rx="2"/><path d="M25 4.5v4a2.2 2.2 0 0 0 0-4z" opacity=".4"/></svg>
    </div>
  </div>

  <!-- ===== 视图区 ===== -->
  <main class="stage" id="stage">

    <!-- 首页 -->
    <section class="view view-home active" id="view-home">
      <div class="badge">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-6.7-4.3-9.3-8.1C.9 10.5 2 6.8 5 5.6 7.2 4.7 9.6 5.5 12 8c2.4-2.5 4.8-3.3 7-2.4 3 1.2 4.1 4.9 2.3 7.3C18.7 16.7 12 21 12 21z"/></svg>
        心動速配中…
      </div>
      <div class="card pop" style="max-width:420px">

<script>
(function(){
  "use strict";

  /* ===== 视图切换（淡入淡出） ===== */
  var views = Array.prototype.slice.call(document.querySelectorAll('.view'));
  function go(id){
    views.forEach(function(v){
      var on = (v.id === id);
      v.classList.toggle('active', on);
      if(on){
        v.querySelectorAll('.card').forEach(function(c){
          c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop');
        });
      }
    });
    window.scrollTo(0,0);
  }

  /* ===== Toast ===== */
  var toastEl = document.getElementById('toast'), toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
  }

  /* ===== 模拟状态栏时间 ===== */
  function tick(){
    var n = new Date();
    var hh = ('0'+n.getHours()).slice(-2), mm = ('0'+n.getMinutes()).slice(-2);
    document.getElementById('sb-time').textContent = hh + ':' + mm;
  }
  tick(); setInterval(tick, 30000);

  /* ===== 首页：願意 → 确认页 ===== */
  document.getElementById('btn-yes').addEventListener('click', function(){ go('view-confirm'); });

  /* ===== 首页：不要按钮随机逃跑 ===== */
  var noBtn = document.getElementById('btn-no');
  var stage = document.getElementById('stage');
  var dodgeCount = 0, escaped = false;
  var tips = ['嘿嘿 點不到我~','你抓不到我啦~','別點嘛 人家害羞~','再見啦 我先跑了~','略略略~','我飛走啦~'];
  function moveNoBtn(){
    if(!escaped){
      escaped = true;
      noBtn.classList.add('escaped');
      var sr = stage.getBoundingClientRect(), br = noBtn.getBoundingClientRect();
      noBtn.style.left = (br.left - sr.left) + 'px';
      noBtn.style.top  = (br.top  - sr.top)  + 'px';
    }
    var sr = stage.getBoundingClientRect();
    var pad = 16;
    var curX = parseFloat(noBtn.style.left), curY = parseFloat(noBtn.style.top);
    var w = noBtn.offsetWidth, h = noBtn.offsetHeight;
    var minX = pad, maxX = Math.max(pad, sr.width  - w - pad * 2);
    var minY = pad, maxY = Math.max(pad, sr.height - h - pad * 2);
    var nx = curX, ny = curY, tries = 0;
    do {
      // 只跳到旁边约两格（2 倍按钮宽/高）的距离内，不跑太远
      nx = Math.min(maxX, Math.max(minX, curX + (Math.random() * 4 - 2) * w));
      ny = Math.min(maxY, Math.max(minY, curY + (Math.random() * 4 - 2) * h));
      tries++;
    } while(Math.abs(nx - curX) + Math.abs(ny - curY) < 40 && tries < 8);
    noBtn.style.left = nx + 'px';
    noBtn.style.top  = ny + 'px';
    noBtn.classList.remove('wobble'); void noBtn.offsetWidth; noBtn.classList.add('wobble');
    dodgeCount++;
    if(dodgeCount % 2 === 0){
      toast(tips[Math.floor(Math.random() * tips.length)]);
    }
  }
  var lastEscape = 0;
  function escapeNo(e){
    e.preventDefault();
    if(Date.now() - lastEscape < 300) return;
    lastEscape = Date.now();
    moveNoBtn();
  }
  noBtn.addEventListener('touchstart', escapeNo, { passive: false });
  noBtn.addEventListener('pointerdown', escapeNo);
  noBtn.addEventListener('click', escapeNo);
  if(window.matchMedia('(pointer:fine)').matches){
    noBtn.addEventListener('mouseenter', moveNoBtn);
  }

  /* ===== 确认页 ===== */
  document.getElementById('btn-ok-confirm').addEventListener('click', function(){ go('view-time'); });
  document.getElementById('back-time').addEventListener('click', function(){ go('view-confirm'); });
  document.getElementById('back-mode').addEventListener('click', function(){ go('view-time'); });

  /* ===== 时间页：日期（未来14天） ===== */
  var wd = ['日','一','二','三','四','五','六'];
  var dateRow = document.getElementById('date-row');
  var pickedDate = null, pickedTime = null;
  var base = new Date();
  var dateOpts = [];
  for(var i = 0; i < 14; i++){
    var dt = new Date(base.getFullYear(), base.getMonth(), base.getDate() + i);
    var top = (i === 0) ? '今天' : (i === 1 ? '明天' : '週' + wd[dt.getDay()]);
    var sub = (dt.getMonth() + 1) + '/' + dt.getDate();
    dateOpts.push({ top: top, sub: sub, full: (dt.getMonth() + 1) + '月' + dt.getDate() + '日 週' + wd[dt.getDay()] });
  }
  dateOpts.forEach(function(o, idx){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'date-chip';
    b.innerHTML = '<span class="dc-top">' + o.top + '</span><span class="dc-sub">' + o.sub + '</span>';
    b.addEventListener('click', function(){
      dateRow.querySelectorAll('.date-chip').forEach(function(c){ c.classList.remove('on'); });
      b.classList.add('on');
      pickedDate = o;
    });
    dateRow.appendChild(b);
  });

  /* ===== 时间页：12:00 - 18:00 ===== */
  var timeGrid = document.getElementById('time-grid');
  var times = [];
  for(var h = 12; h <= 18; h++){
    for(var m = 0; m < 60; m += 30){
      if(h === 18 && m === 30) continue;
      times.push(('0'+h).slice(-2) + ':' + ('0'+m).slice(-2));
    }
  }
  times.forEach(function(t){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'time-chip'; b.textContent = t;
    b.addEventListener('click', function(){
      timeGrid.querySelectorAll('.time-chip').forEach(function(c){ c.classList.remove('on'); });
      b.classList.add('on');
      pickedTime = t;
    });
    timeGrid.appendChild(b);
  });

  /* ===== 时间页：確定時間 ===== */
  document.getElementById('btn-time-ok').addEventListener('click', function(){
    if(!pickedDate){ toast('先選個日期嘛~'); return; }
    if(!pickedTime){ toast('再選個時間嘛~'); return; }
    go('view-mode');
  });

  /* ===== 模式页：多选 ===== */
  var modes = ['匹配','聯合','摸金','自訂','模仿','捉迷藏','塔羅','其他'];
  var modeGrid = document.getElementById('mode-grid');
  var pickedModes = [];
  var checkSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5L19.5 7"/></svg>';
  modes.forEach(function(m){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'mode-chip';
    b.innerHTML = '<span class="check">' + checkSvg + '</span>' + m;
    b.addEventListener('click', function(){
      var on = b.classList.toggle('on');
      var idx = pickedModes.indexOf(m);
      if(on && idx === -1){ pickedModes.push(m); }
      if(!on && idx > -1){ pickedModes.splice(idx, 1); }
    });
    modeGrid.appendChild(b);
  });

  /* ===== 模式页：就選這些！ ===== */
  document.getElementById('btn-mode-ok').addEventListener('click', function(){
    if(pickedModes.length === 0){ toast('至少要選一個模式嘛~'); return; }
    document.getElementById('r-date').textContent  = pickedDate.full;
    document.getElementById('r-time').textContent  = pickedTime;
    document.getElementById('r-modes').textContent = pickedModes.join('、');
    go('view-result');
  });

  /* ===== 结果页：转发式回覆（零配置） ===== */
  var INVITER_EMAIL = 'a.i.channel.ouo@gmail.com';
  function replyText(){
    return '想跟你一起打第五！我選好了～\n'
      + '日期：' + (pickedDate ? pickedDate.full : '') + '\n'
      + '時間：' + (pickedTime || '') + '\n'
      + '模式：' + (pickedModes.join('、') || '');
  }
  function fallbackCopy(t, done){
    var ta = document.createElement('textarea');
    ta.value = t;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); }
    catch(e){ toast('複製失敗，長按手動複製吧'); }
    document.body.removeChild(ta);
  }
  document.getElementById('btn-reply').addEventListener('click', function(){
    var text = replyText();
    if(navigator.share){
      navigator.share({ title: '約你打第五', text: text }).catch(function(){});
    } else {
      window.location.href = 'mailto:' + INVITER_EMAIL
        + '?subject=' + encodeURIComponent('想跟你一起打第五！')
        + '?body=' + encodeURIComponent(text);
    }
  });

  /* ===== 结果页：複製結果圖片（canvas 生成 + 剪贴板） ===== */
  function drawHeart(c, cx, cy, s, color){
    c.save(); c.translate(cx, cy); c.scale(s / 100, s / 100); c.fillStyle = color;
    c.beginPath();
    c.moveTo(0, 35);
    c.bezierCurveTo(-55, -15, -25, -65, 0, -25);
    c.bezierCurveTo(25, -65, 55, -15, 0, 35);
    c.closePath(); c.fill(); c.restore();
  }
  function drawStar(c, cx, cy, r, color){
    c.save(); c.translate(cx, cy); c.fillStyle = color;
    c.beginPath();
    for(var i = 0; i < 5; i++){
      var a1 = -Math.PI / 2 + i * 2 * Math.PI / 5;
      var a2 = a1 + Math.PI / 5;
      var px = Math.cos(a1) * r, py = Math.sin(a1) * r;
      var qx = Math.cos(a2) * r * 0.45, qy = Math.sin(a2) * r * 0.45;
      if(i === 0) c.moveTo(px, py); else c.lineTo(px, py);
      c.lineTo(qx, qy);
    }
    c.closePath(); c.fill(); c.restore();
  }
  function roundRect(c, px, py, w, h, r){
    c.beginPath();
    c.moveTo(px + r, py);
    c.arcTo(px + w, py, px + w, py + h, r);
    c.arcTo(px + w, py + h, px, py + h, r);
    c.arcTo(px, py + h, px, py, r);
    c.arcTo(px, py, px + w, py, r);
    c.closePath();
  }
  function buildResultImage(cb){
    var img = document.querySelector('.result-avatar img');
    function draw(){
      var cv = document.createElement('canvas');
      cv.width = 1080; cv.height = 1350;
      var c = cv.getContext('2d');
      var g = c.createLinearGradient(0, 0, 1080, 1350);
      g.addColorStop(0, '#FFE0EF'); g.addColorStop(0.5, '#F6E0FF'); g.addColorStop(1, '#E1CDFF');
      c.fillStyle = g; c.fillRect(0, 0, 1080, 1350);
      drawHeart(c, 130, 270, 55, 'rgba(255,127,168,.45)');
      drawStar(c, 950, 190, 44, 'rgba(201,168,255,.55)');
      drawHeart(c, 950, 640, 42, 'rgba(255,127,168,.4)');
      drawStar(c, 140, 950, 40, 'rgba(201,168,255,.5)');
      drawHeart(c, 165, 1180, 48, 'rgba(255,127,168,.4)');
      drawStar(c, 930, 1140, 44, 'rgba(201,168,255,.5)');
      c.save();
      c.beginPath(); c.arc(540, 320, 158, 0, Math.PI * 2);
      c.fillStyle = 'rgba(255,179,206,.55)'; c.fill();
      c.restore();
      c.save();
      c.beginPath(); c.arc(540, 320, 136, 0, Math.PI * 2); c.clip();
      c.drawImage(img, 540 - 136, 320 - 136, 272, 272);
      c.restore();
      c.strokeStyle = '#fff'; c.lineWidth = 10;
      c.beginPath(); c.arc(540, 320, 136, 0, Math.PI * 2); c.stroke();
      c.textAlign = 'center';
      c.fillStyle = '#7A4F8E';
      c.font = 'bold 54px "ZCOOL KuaiLe","Noto Sans SC",sans-serif';
      c.fillText('真開心你沒有拒絕——', 540, 590);
      c.fillText('我會準時來接你！', 540, 664);
      roundRect(c, 84, 748, 912, 396, 50);
      c.fillStyle = '#fff'; c.fill();
      var rows = [
        ['日期', pickedDate ? pickedDate.full : ''],
        ['時間', pickedTime || ''],
        ['模式', pickedModes.join('、') || '']
      ];
      rows.forEach(function(rw, i){
        var y = 748 + 132 + i * 132;
        c.fillStyle = '#B58AC9';
        c.textAlign = 'left';
        c.font = '44px "ZCOOL KuaiLe","Noto Sans SC",sans-serif';
        c.fillText(rw[0], 160, y);
        c.fillStyle = '#7A4F8E';
        c.textAlign = 'right';
        c.font = 'bold 46px "ZCOOL KuaiLe","Noto Sans SC",sans-serif';
        c.fillText(rw[1], 920, y);
        if(i < 2){
          c.strokeStyle = '#F3D6E8'; c.lineWidth = 4;
          c.setLineDash([14, 14]);
          c.beginPath(); c.moveTo(160, y + 48); c.lineTo(920, y + 48); c.stroke();
          c.setLineDash([]);
        }
      });
      c.textAlign = 'center';
      c.fillStyle = '#B57BD4';
      c.font = '42px "ZCOOL KuaiLe","Noto Sans SC",sans-serif';
      c.fillText('我等你上線就好', 540, 1258);
      drawHeart(c, 400, 1258, 26, 'rgba(255,127,168,.8)');
      drawHeart(c, 680, 1258, 26, 'rgba(255,127,168,.8)');
      cv.toBlob(cb, 'image/png');
    }
    if(img && img.complete){ draw(); } else { img.onload = draw; }
  }
  function saveImageBlob(blob){
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '約你打第五-選擇.png';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 500);
    toast('已儲存圖片，發給 TA 就好啦~');
  }
  document.getElementById('btn-copy').addEventListener('click', function(){
    buildResultImage(function(blob){
      if(!blob){ toast('生成圖片失敗，請重試'); return; }
      if(navigator.clipboard && window.ClipboardItem && navigator.clipboard.write){
        navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
          .then(function(){ toast('圖片已複製！貼給 TA 就好啦~'); })
          .catch(function(){ saveImageBlob(blob); });
      } else {
        saveImageBlob(blob);
      }
    });
  });

})();
</script>
</body>
</html>
